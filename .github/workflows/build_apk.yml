name: Build Android APK - Melody_of_Us

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      # ✅ 添加 Android 平台（如果不存在）
      - name: Add Android platform if missing
        run: |
          if [ ! -d "./android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melody_of_Us-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk