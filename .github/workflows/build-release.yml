name: Build Signed Android APK - Melody_of_Us

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d "./android" ]; then
            npx cap add android
          else
            echo "Android platform exists, skipping."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy keystore
        run: |
          mkdir -p android/app
          cp my-release-key.jks android/app/

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: a53092520110
          KEY_ALIAS_PASSWORD: a53092520110
        run: |
          cd android
          ./gradlew assembleRelease -PkeystorePassword=$KEYSTORE_PASSWORD -PkeyPassword=$KEY_ALIAS_PASSWORD

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Melody_of_Us-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
