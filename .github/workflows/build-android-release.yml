name: Build Web & Android APK

# 触发方式：
# 1. 手动触发（Actions 页面 Run workflow，可填发布标签）
# 2. 推送 v* 标签（如 v1.2.0）→ 自动发布 GitHub Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签（如 v1.2.0；留空则只上传构建产物，不发布 Release）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 可选签名密钥（GitHub Secrets；未配置则使用 debug 签名）
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: 生成 Android 工程（Capacitor）
        run: npx cap add android

      - name: 应用安全加固覆盖层（WebView 配置 / Manifest）
        run: |
          cp ci/android-overlay/MainActivity.java android/app/src/main/java/com/melody/ai/MainActivity.java
          cp ci/android-overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 同步 Web 产物到 Android 工程
        run: npx cap sync android

      - name: 配置签名（有 Secret 用 release 签名，否则用 debug 签名便于侧载）
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
            echo "已配置 release 签名"
          else
            sed -i 's|minifyEnabled false|minifyEnabled false\n            signingConfig signingConfigs.debug|' android/app/build.gradle
            echo "未提供签名 Secret，使用 debug 签名"
          fi

      - name: 构建 APK（release）
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: melody-ai-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传 Web 构建产物
        run: zip -q -r playground-web.zip dist/playground
      - uses: actions/upload-artifact@v4
        with:
          name: playground-web
          path: playground-web.zip

      - name: 发布 GitHub Release（标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            playground-web.zip
          generate_release_notes: true

      - name: 发布 GitHub Release（手动触发且填写了标签）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            playground-web.zip
          generate_release_notes: true
