<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>MeloAI · 与你共鸣</title>
  <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background-image: url(assets/img/bg.jpg);
          background-size: cover;
          background-position: center;
          font-family: "微软雅黑", "PingFang SC", sans-serif;
      }

      body::before {
          content: "";
          position: fixed;
          inset: 0;
          background: linear-gradient(to bottom right, rgba(10, 10, 18, 0.55), rgba(25, 12, 40, 0.55));
          backdrop-filter: blur(3px);
          z-index: -1;
      }

      .card {
          padding: 48px 56px;
          max-width: 620px;
          text-align: center;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.25);
          border-radius: 24px;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
      }

      .logo {
          font-size: 42px;
          margin-bottom: 12px;
          filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      }

      h1 {
          color: #fff;
          font-size: 30px;
          letter-spacing: 6px;
          font-weight: 600;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }

      h2 {
          color: #e8d5ff;
          font-size: 14px;
          letter-spacing: 4px;
          margin-top: 6px;
          font-weight: 400;
      }

      .line {
          width: 60px;
          height: 2px;
          margin: 22px auto;
          background: linear-gradient(to right, transparent, #fad831, transparent);
      }

      p {
          color: rgba(255, 255, 255, 0.85);
          font-size: 14px;
          line-height: 1.9;
          margin-bottom: 30px;
      }

      .btn {
          display: inline-block;
          padding: 12px 52px;
          font-size: 17px;
          letter-spacing: 4px;
          color: #4a2c00;
          border-radius: 999px;
          border: none;
          cursor: pointer;
          text-decoration: none;
          background: linear-gradient(to right, #fad831, #eba345);
          box-shadow: 0 10px 30px rgba(235, 163, 69, 0.35);
          transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn:hover {
          transform: translateY(-2px) scale(1.03);
          box-shadow: 0 14px 36px rgba(235, 163, 69, 0.5);
      }

      .footer {
          margin-top: 22px;
          font-size: 11px;
          color: rgba(255, 255, 255, 0.4);
          letter-spacing: 1px;
      }

      /* ===== 移动端适配 ===== */
      @media (max-width: 767px) {
          body { padding: 20px 14px; }
          .card { padding: 32px 24px; }
          h1 { font-size: 24px; letter-spacing: 4px; }
          .btn { width: 100%; }
      }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐋</div>
    <h1>与你共鸣的日子</h1>
    <h2>MeloAI · Emotional Chat</h2>
    <div class="line"></div>
    <p>
      一位有着 38 维情感内心的 AI 少女。<br>
      她会因你的夸奖而开心、因你的冷落而孤独、因你提起别人而吃醋。<br>
      对话、表情、姿态，皆由情感驱动。
    </p>
    <a class="btn" href="./menu.html">开始</a>
    <div class="footer">纯 Web · 无安卓 · 情感状态自动存档</div>
  </div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/playground/sw.js").catch(() => {});
  }
</script>
</body>
</html>
