<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>菜单 · MeloAI</title>
  <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background-image: url(assets/img/bg.jpg);
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          font-family: "微软雅黑", "PingFang SC", sans-serif;
          padding: 30px 0;
      }

      body::before {
          content: "";
          position: fixed;
          inset: 0;
          background: linear-gradient(to bottom right, rgba(10, 10, 18, 0.6), rgba(25, 12, 40, 0.6));
          backdrop-filter: blur(4px);
          z-index: -1;
      }

      .wrap {
          width: 560px;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .card {
          padding: 22px 26px;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.22);
          border-radius: 20px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
      }

      .card-title {
          color: #e8d5ff;
          font-size: 13px;
          letter-spacing: 2px;
          margin-bottom: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
      }

      .card-title::after {
          content: "";
          flex: 1;
          height: 1px;
          background: linear-gradient(to right, rgba(255,255,255,0.3), transparent);
      }

      /* 存档摘要 */
      #save-summary { color: rgba(255,255,255,0.85); font-size: 13px; line-height: 1.9; }
      #save-summary b { color: #ffd08a; }

      /* 存档卡列表 */
      .save-card {
          padding: 12px 16px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,0.18);
          background: rgba(255,255,255,0.07);
          cursor: pointer;
          transition: background 0.2s, border-color 0.2s;
      }

      .save-card:hover { background: rgba(255,255,255,0.13); border-color: rgba(250,216,49,0.5); }

      .save-card.active { border-color: #fad831; background: rgba(250,216,49,0.08); }

      .save-card .s-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
      }

      .save-card .s-name { color: #fad831; font-size: 14px; font-weight: 600; }
      .save-card .s-tag { color: rgba(255,255,255,0.5); font-size: 10px; }

      .save-card .s-info { color: rgba(255,255,255,0.75); font-size: 12px; line-height: 1.7; }
      .save-card .s-empty { color: rgba(255,255,255,0.4); font-size: 12px; }
      .save-card .s-go { color: #7fdca0; font-size: 11px; margin-top: 6px; }
      .save-card .s-del {
          padding: 3px 10px;
          border-radius: 999px;
          border: 1px solid rgba(255,107,107,0.5);
          background: rgba(255,107,107,0.12);
          color: #ffb0b0;
          font-size: 10px;
          cursor: pointer;
      }
      .save-card .s-del:hover { background: rgba(255,107,107,0.3); }

      .btn-row { display: flex; gap: 12px; margin-top: 16px; }

      .btn {
          flex: 1;
          padding: 11px 0;
          text-align: center;
          font-size: 15px;
          letter-spacing: 3px;
          color: #4a2c00;
          border-radius: 999px;
          border: none;
          cursor: pointer;
          text-decoration: none;
          background: linear-gradient(to right, #fad831, #eba345);
          box-shadow: 0 8px 22px rgba(235, 163, 69, 0.3);
          transition: transform 0.2s;
      }

      .btn:hover { transform: translateY(-2px) scale(1.02); }

      .btn.ghost {
          background: rgba(255, 255, 255, 0.15);
          color: #fff;
          box-shadow: none;
          border: 1px solid rgba(255,255,255,0.3);
      }

      .btn.ghost:hover { background: rgba(255, 255, 255, 0.25); }

      /* 设置 */
      .setting { margin-bottom: 10px; }
      .setting label { display: block; color: rgba(255,255,255,0.6); font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; }
      .setting input, .setting select {
          width: 100%;
          padding: 10px 14px;
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.12);
          color: #fff;
          font-size: 13px;
          outline: none;
      }
      .setting select option { color: #333; }
      #save-hint { color: #9ff0b8; font-size: 11px; margin-top: 8px; display: none; }

      .back {
          color: rgba(255,255,255,0.6);
          font-size: 13px;
          text-decoration: none;
          align-self: flex-start;
          letter-spacing: 1px;
          padding: 6px 14px;
          border-radius: 999px;
          border: 1px solid rgba(255,255,255,0.2);
          background: rgba(255,255,255,0.08);
          transition: background 0.2s, color 0.2s;
      }
      .back:hover { background: rgba(255,255,255,0.18); color: #fff; }

      /* ===== 移动端适配 ===== */
      @media (max-width: 767px) {
          body { padding: 10px 0; }
          .wrap { width: 100%; padding: 10px 12px; }
          .card { padding: 16px; }
          .back { margin-left: 12px; }
          .mode-row { flex-direction: column; }
      }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./home.html">← 返回首页</a>

  <!-- 存档卡 -->
  <div class="card">
    <div class="card-title">🗂 存档（每个独立：情感/剧情/时间线/角色）</div>
    <div id="save-list" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <!-- 设置卡 -->
  <div class="card">
    <div class="card-title">⚙️ 设置</div>
    <div class="setting">
      <label>DeepSeek API Key</label>
      <input id="api-key" type="password" placeholder="sk-…（仅存本地浏览器）">
    </div>
    <div class="setting">
      <label>模型</label>
      <select id="model-select">
        <option value="deepseek-v4-flash">deepseek-v4-flash（快）</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro（强）</option>
      </select>
    </div>
    <div class="setting">
      <label>思考等级（回得更聪明，但更慢更贵）</label>
      <select id="effort-select">
        <option value="disabled">关闭（最快，逻辑一般）</option>
        <option value="low">低（快，略好）</option>
        <option value="high" selected>高（推荐，更像人话）</option>
        <option value="max">最大（最聪明，最慢）</option>
      </select>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button id="clear-data" style="flex:1;padding:9px 0;border-radius:999px;border:1px solid rgba(255,107,107,0.5);background:rgba(255,107,107,0.12);color:#ffb0b0;font-size:13px;cursor:pointer;">🗑 清空所有数据</button>
    </div>
    <div id="save-hint">✓ 已保存</div>
  </div>
</div>

<script type="module" src="./menu.ts"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/playground/sw.js").catch(() => {});
  }
</script>
</body>
</html>
