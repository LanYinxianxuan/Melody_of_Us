<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d65a7e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>菜单 · MeloAI</title>
  <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
          --accent: #d65a7e;
          --accent-deep: #b84567;
          --accent-soft: rgba(214, 90, 126, 0.10);
          --accent-line: rgba(214, 90, 126, 0.24);
          --ink: #2d2a32;
          --ink-soft: #6e6a76;
          --ink-faint: #a39dab;
          --card: rgba(255, 255, 255, 0.88);
          --card-strong: #ffffff;
          --bg: #faf7f4;
          --line: rgba(45, 42, 50, 0.08);
          --shadow: 0 6px 24px rgba(120, 80, 60, 0.10);
          --shadow-lg: 0 16px 48px rgba(120, 80, 60, 0.16);
          --shadow-accent: 0 6px 20px rgba(214, 90, 126, 0.28);
          --radius-lg: 24px;
          --radius-md: 14px;
          --radius-sm: 8px;
      }

      body {
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background-image: url(assets/img/bg.jpg);
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "微软雅黑", "Noto Sans SC", sans-serif;
          color: var(--ink);
          padding: 30px 0;
      }

      body::before {
          content: "";
          position: fixed;
          inset: 0;
          background:
              radial-gradient(1200px 600px at 20% -10%, rgba(192, 132, 252, 0.28), transparent 60%),
              radial-gradient(1000px 500px at 100% 110%, rgba(244, 114, 182, 0.22), transparent 60%),
              linear-gradient(to bottom right, rgba(255, 255, 255, 0.62), rgba(240, 230, 255, 0.72));
          backdrop-filter: blur(6px);
          z-index: -1;
      }

      .wrap {
          width: 560px;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .card {
          padding: 22px 26px;
          background: var(--card);
          border: 1px solid rgba(255, 255, 255, 0.65);
          border-radius: var(--radius-lg);
          box-shadow: var(--shadow);
          backdrop-filter: blur(24px) saturate(1.2);
          -webkit-backdrop-filter: blur(24px) saturate(1.2);
      }

      .card-title {
          color: var(--accent);
          font-size: 13px;
          letter-spacing: 2px;
          margin-bottom: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
      }

      .card-title::after {
          content: "";
          flex: 1;
          height: 1px;
          background: linear-gradient(to right, var(--line), transparent);
      }

      /* 存档摘要 */
      #save-summary { color: var(--ink); font-size: 13px; line-height: 1.9; }
      #save-summary b { color: var(--accent-2); }

      /* 存档卡列表 */
      .save-card {
          padding: 12px 16px;
          border-radius: 14px;
          border: 1px solid var(--line);
          background: var(--card);
          cursor: pointer;
          transition: background 0.2s, border-color 0.2s;
      }

      .save-card:hover { background: var(--card-strong); border-color: var(--accent); box-shadow: var(--shadow); }

      .save-card.active { border-color: var(--accent); background: var(--accent-soft); }

      .save-card .s-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
      }

      .save-card .s-name { color: var(--accent); font-size: 14px; font-weight: 600; }
      .save-card .s-tag { color: var(--ink-soft); font-size: 10px; }

      .save-card .s-info { color: var(--ink); font-size: 12px; line-height: 1.7; }
      .save-card .s-empty { color: var(--ink-soft); font-size: 12px; }
      .save-card .s-go { color: #34d399; font-size: 11px; margin-top: 6px; }
      .save-card .s-del {
          padding: 3px 10px;
          border-radius: 999px;
          border: 1px solid rgba(255,107,107,0.5);
          background: rgba(255,107,107,0.12);
          color: #ffb0b0;
          font-size: 10px;
          cursor: pointer;
      }
      .save-card .s-del:hover { background: rgba(255,107,107,0.3); }

      .btn-row { display: flex; gap: 12px; margin-top: 16px; }

      .btn {
          flex: 1;
          padding: 11px 0;
          text-align: center;
          font-size: 15px;
          letter-spacing: 3px;
          color: #fff;
          border-radius: 999px;
          border: none;
          cursor: pointer;
          text-decoration: none;
          background: var(--accent);
          box-shadow: 0 8px 22px rgba(235, 163, 69, 0.3);
          transition: transform 0.2s;
      }

      .btn:hover { transform: translateY(-2px) scale(1.02); }

      .btn.ghost {
          background: var(--card);
          color: var(--ink-soft);
          box-shadow: none;
          border: 1px solid var(--line);
      }

      .btn.ghost:hover { background: var(--accent-soft); color: var(--accent); }

      /* 设置 */
      .setting { margin-bottom: 10px; }
      .setting label { display: block; color: var(--ink-soft); font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; }
      .setting input, .setting select {
          width: 100%;
          padding: 10px 14px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: var(--card);
          color: var(--ink);
          font-size: 13px;
          outline: none;
      }
      .setting select option { color: #333; }
      #save-hint { color: #34d399; font-size: 11px; margin-top: 8px; display: none; }

      .back {
          color: var(--ink-soft);
          font-size: 13px;
          text-decoration: none;
          align-self: flex-start;
          letter-spacing: 1px;
          padding: 6px 14px;
          border-radius: 999px;
          border: 1px solid var(--line);
          background: var(--card);
          transition: all 0.2s;
      }
      .back:hover { background: var(--accent-soft); color: var(--accent); }

      /* ===== 移动端适配 ===== */
      @media (max-width: 767px) {
          body { padding: 10px 0; }
          .wrap { width: 100%; padding: 10px 12px; }
          .card { padding: 16px; }
          .back { margin-left: 12px; }
          .mode-row { flex-direction: column; }
      }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./home.html">← 返回首页</a>

  <!-- 存档卡 -->
  <div class="card">
    <div class="card-title">🗂 存档（每个独立：情感/剧情/时间线/角色）</div>
    <div id="save-list" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <!-- 设置卡 -->
  <div class="card">
    <div class="card-title">⚙️ 设置</div>
    <div class="setting">
      <label>DeepSeek API Key</label>
      <input id="api-key" type="password" placeholder="sk-…（仅存本地浏览器）">
    </div>
    <div class="setting">
      <label>模型</label>
      <select id="model-select">
        <option value="deepseek-v4-flash">deepseek-v4-flash（快）</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro（强）</option>
      </select>
    </div>
    <div class="setting">
      <label>思考等级（回得更聪明，但更慢更贵）</label>
      <select id="effort-select">
        <option value="disabled">关闭（最快，逻辑一般）</option>
        <option value="low">低（快，略好）</option>
        <option value="high" selected>高（推荐，更像人话）</option>
        <option value="max">最大（最聪明，最慢）</option>
      </select>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button id="clear-data" style="flex:1;padding:9px 0;border-radius:999px;border:1px solid rgba(255,107,107,0.5);background:rgba(255,107,107,0.12);color:#ffb0b0;font-size:13px;cursor:pointer;">🗑 清空所有数据</button>
    </div>
    <div id="save-hint">✓ 已保存</div>
  </div>
</div>

<script type="module" src="./menu.ts"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
</script>
</body>
</html>
