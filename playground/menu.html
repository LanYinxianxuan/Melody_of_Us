<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#d65a7e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>菜单 · MeloAI</title>
  <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* 全局溢出保护：任何子元素不产生横向滚动/溢出 */
      html, body { max-width: 100%; overflow-x: hidden; }
      img, canvas, svg, video { max-width: 100%; }


      :root {
          --accent: #d65a7e;
          --accent-deep: #b84567;
          --accent-soft: rgba(214, 90, 126, 0.10);
          --accent-line: rgba(214, 90, 126, 0.24);
          --ink: #2d2a32;
          --ink-soft: #6e6a76;
          --ink-faint: #a39dab;
          --card: rgba(255, 255, 255, 0.88);
          --card-strong: #ffffff;
          --bg: #faf7f4;
          --line: rgba(45, 42, 50, 0.08);
          --shadow: 0 6px 24px rgba(120, 80, 60, 0.10);
          --shadow-lg: 0 16px 48px rgba(120, 80, 60, 0.16);
          --shadow-accent: 0 6px 20px rgba(214, 90, 126, 0.28);
          --radius-lg: 24px;
          --radius-md: 14px;
          --radius-sm: 8px;
      }

      body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          background-image: url(./assets/bg-ZvSl1C-y.jpg);
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "微软雅黑", "Noto Sans SC", sans-serif;
          color: var(--ink);
          padding: 30px 0;
      }

      body::before {
          content: "";
          position: fixed;
          inset: 0;
          background:
              radial-gradient(1200px 600px at 20% -10%, rgba(192, 132, 252, 0.28), transparent 60%),
              radial-gradient(1000px 500px at 100% 110%, rgba(244, 114, 182, 0.22), transparent 60%),
              linear-gradient(to bottom right, rgba(255, 255, 255, 0.62), rgba(240, 230, 255, 0.72));
          backdrop-filter: blur(6px);
          z-index: -1;
      }

      .wrap {
          width: 560px;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .card {
          padding: 22px 26px;
          background: rgba(255, 255, 255, 0.42);
          border: 1px solid rgba(255, 255, 255, 0.55);
          border-radius: var(--radius-lg);
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 12px 40px rgba(120, 80, 60, 0.16);
          backdrop-filter: blur(28px) saturate(1.6);
          -webkit-backdrop-filter: blur(28px) saturate(1.6);
      }

      .card-title {
          color: var(--accent);
          font-size: 13px;
          letter-spacing: 2px;
          margin-bottom: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
      }

      .card-title::after {
          content: "";
          flex: 1;
          height: 1px;
          background: linear-gradient(to right, var(--line), transparent);
      }

      /* 存档摘要 */
      #save-summary { color: var(--ink); font-size: 13px; line-height: 1.9; }
      #save-summary b { color: var(--accent-2); }

      /* 存档卡列表 */
      .save-card {
          padding: 12px 16px;
          border-radius: 14px;
          border: 1px solid var(--line);
          background: var(--card);
          cursor: pointer;
          transition: background 0.2s, border-color 0.2s;
      }

      .save-card:hover { background: var(--card-strong); border-color: var(--accent); box-shadow: var(--shadow); }

      .save-card.active { border-color: var(--accent); background: var(--accent-soft); }

      .save-card .s-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
      }

      .save-card .s-name { color: var(--accent); font-size: 14px; font-weight: 600; }
      .save-card .s-tag { color: var(--ink-soft); font-size: 10px; }

      .save-card .s-info { color: var(--ink); font-size: 12px; line-height: 1.7; }
      .save-card .s-empty { color: var(--ink-soft); font-size: 12px; }
      .save-card .s-go { color: #34d399; font-size: 11px; margin-top: 6px; }
      .save-card .s-del {
          padding: 3px 10px;
          border-radius: 999px;
          border: 1px solid rgba(255,107,107,0.5);
          background: rgba(255,107,107,0.12);
          color: #ffb0b0;
          font-size: 10px;
          cursor: pointer;
      }
      .save-card .s-del:hover { background: rgba(255,107,107,0.3); }

      .btn-row { display: flex; gap: 12px; margin-top: 16px; }

      .btn {
          flex: 1;
          padding: 11px 0;
          text-align: center;
          font-size: 15px;
          letter-spacing: 3px;
          color: #fff;
          border-radius: 999px;
          border: none;
          cursor: pointer;
          text-decoration: none;
          background: var(--accent);
          box-shadow: 0 8px 22px rgba(235, 163, 69, 0.3);
          transition: transform 0.2s;
      }

      .btn:hover { transform: translateY(-2px) scale(1.02); }

      .btn.ghost {
          background: var(--card);
          color: var(--ink-soft);
          box-shadow: none;
          border: 1px solid var(--line);
      }

      .btn.ghost:hover { background: var(--accent-soft); color: var(--accent); }

      /* 设置 */
      .setting { margin-bottom: 10px; }
      .setting label { display: block; color: var(--ink-soft); font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; }
      .setting input, .setting select {
          width: 100%;
          padding: 10px 14px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: var(--card);
          color: var(--ink);
          font-size: 13px;
          outline: none;
      }
      .setting select option { color: #333; }
      #save-hint { color: #34d399; font-size: 11px; margin-top: 8px; display: none; }

      .back {
          color: var(--ink-soft);
          font-size: 13px;
          text-decoration: none;
          align-self: flex-start;
          letter-spacing: 1px;
          padding: 6px 14px;
          border-radius: 999px;
          border: 1px solid var(--line);
          background: var(--card);
          transition: all 0.2s;
      }
      .back:hover { background: var(--accent-soft); color: var(--accent); }

      /* ===== 移动端适配 ===== */
      @media (max-width: 767px) {
          body { padding: 10px 0; }
          .wrap { width: 100%; padding: 10px 12px; }
          .card { padding: 16px; }
          .back { margin-left: 12px; }
          .mode-row { flex-direction: column; }
      }
  </style>
  <script type="module" crossorigin src="./assets/menu-4VZrHyJ9.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/tts-mZod1DWQ.js">
</head>
<body>
<div class="wrap">
  <a class="back" href="./home.html">← 返回首页</a>

  <!-- 存档卡 -->
  <div class="card">
    <div class="card-title">🗂 存档（每个独立：情感/剧情/时间线/角色）</div>
    <div id="save-list" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <!-- 设置卡 -->
  <div class="card">
    <div class="card-title">⚙️ 设置</div>
    <div id="slot-label" style="font-size:12px;color:var(--accent);margin-bottom:12px;padding:6px 10px;background:var(--accent-soft);border-radius:8px;">存档 1 的 API 设置</div>
    <div class="setting">
      <label>模型供应商</label>
      <select id="provider-select">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI（GPT）</option>
        <option value="claude">Claude（Anthropic）</option>
        <option value="gemini">Google Gemini</option>
        <option value="moonshot">Moonshot（Kimi）</option>
        <option value="qwen">通义千问（阿里）</option>
        <option value="zhipu">智谱（GLM）</option>
        <option value="xiaomi">小米 MiMo</option>
        <option value="custom">自定义（OpenAI 兼容）</option>
      </select>
    </div>
    <div class="setting">
      <label>API Key</label>
      <div style="display:flex;gap:8px;">
        <input id="api-key" type="password" placeholder="sk-…（仅存本地浏览器）" style="flex:1;">
        <button id="api-test" style="padding:10px 16px;border-radius:12px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12px;cursor:pointer;white-space:nowrap;">🔍 测试</button>
      </div>
      <div id="api-status" style="font-size:11px;margin-top:6px;display:none;"></div>
    </div>
    <div class="setting" id="custom-url-setting" style="display:none;">
      <label>自定义 API 地址</label>
      <input id="custom-url" type="text" placeholder="https://your-api.com/v1">
    </div>
    <div class="setting">
      <label>模型</label>
      <select id="model-select">
        <option value="deepseek-chat">deepseek-chat</option>
      </select>
    </div>
    <div class="setting">
      <label>思考等级（回得更聪明，但更慢更贵）</label>
      <select id="effort-select">
        <option value="disabled">关闭（最快，逻辑一般）</option>
        <option value="low">低（快，略好）</option>
        <option value="high" selected>高（推荐，更像人话）</option>
        <option value="max">最大（最聪明，最慢）</option>
      </select>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button id="clear-data" style="flex:1;padding:9px 0;border-radius:999px;border:1px solid rgba(255,107,107,0.5);background:rgba(255,107,107,0.12);color:#ffb0b0;font-size:13px;cursor:pointer;">🗑 清空所有数据</button>
    </div>
    <div id="save-hint">✓ 已保存</div>
  </div>

  <!-- TTS 语音设置卡 -->
  <div class="card">
    <div class="card-title">🎤 语音朗读（TTS）</div>
    <div style="font-size:11px;color:var(--ink-faint);margin-bottom:12px;padding:8px;background:var(--accent-soft);border-radius:8px;">
      💡 TTS 使用小米 MiMo VoiceClone API，需在上方「API 设置」中选择「小米 MiMo」供应商并填写 API Key。
    </div>
    <div class="setting">
      <label>TTS 专用 API Key（可选，留空则使用上方的 Key）</label>
      <input id="tts-api-key" type="password" placeholder="sk-…（仅存本地浏览器）">
    </div>
    <div class="setting">
      <label>音色样本（上传 MP3/WAV，10MB 以内，将克隆此音色）</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="tts-voice-file" type="file" accept="audio/mp3,audio/mpeg,audio/wav" style="flex:1;font-size:12px;">
        <button id="tts-voice-clear" style="padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:11px;cursor:pointer;">清除</button>
      </div>
      <div id="tts-voice-status" style="font-size:11px;margin-top:4px;color:var(--ink-soft);">未上传</div>
    </div>
    <div class="setting">
      <label>合成语言（中文会自动翻译成日文再合成）</label>
      <select id="tts-lang">
        <option value="zh">🇨🇳 中文（原声）</option>
        <option value="ja">🇯🇵 日本語（自动翻译）</option>
      </select>
    </div>
    <div class="setting">
      <label>风格指令（可选，控制语气/情感/语速，如「温柔轻声」「活泼元气」）</label>
      <input id="tts-style" type="text" placeholder="如：温柔轻声，带一点害羞">
    </div>
    <div class="setting">
      <label>TTS 测试</label>
      <div style="display:flex;gap:8px;">
        <input id="tts-test-text" type="text" placeholder="输入要朗读的文字（中文）" style="flex:1;">
        <button id="tts-test-btn" style="padding:8px 16px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12px;cursor:pointer;">🔊 试听</button>
      </div>
      <div id="tts-test-status" style="font-size:11px;margin-top:4px;color:var(--ink-soft);"></div>
    </div>
  </div>

  <footer style="text-align:center;padding:24px 16px;color:var(--ink-faint);font-size:11px;line-height:2;">
    <div style="margin-bottom:4px;">Melody of Us · 情感 AI 聊天 · 38 维情感体系</div>
    <div>作者：<a href="https://github.com/LanYinxianxuan" target="_blank" style="color:var(--accent);text-decoration:none;">LanYinxianxuan</a> ｜ GitHub：<a href="https://github.com/LanYinxianxuan/Melody_of_Us" target="_blank" style="color:var(--accent);text-decoration:none;">Melody_of_Us</a> ｜ 分支：melody-ai</div>
    <div style="margin-top:2px;">开源协议：MIT License</div>
  </footer>
</div>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
</script>
</body>
</html>
