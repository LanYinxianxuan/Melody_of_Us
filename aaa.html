<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建新的存档</title>
  <style>
    /* 背景和叠加层 */
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background-image: url(../assets/img/G36vr5qXQAAEvgn.jpg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        rgba(10, 10, 18, 0.45),
        rgba(25, 12, 40, 0.45)
      );
      pointer-events: none;
      z-index: -1;
    }

    /* 卡片容器 */
    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px 40px;
      background-color: rgba(50, 50, 50, 0.35);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }

    /* 标题 */
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 25px;
      text-shadow: 0 0 10px #ffd700, 0 0 20px #ffa500;
    }

    /* 表单控件 */
    input, textarea, select {
      width: 100%;
      padding: 10px 15px;
      margin: 10px 0 20px 0;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.5);
      background-color: rgba(103,103,103,0.35);
      color: white;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #ffd700;
      box-shadow: 0 4px 20px rgba(255, 218, 49, 0.6);
      transform: scale(1.02);
    }

    /* 创建存档按钮 */
    #archive_initialization {
      width: 100%;
      padding: 15px 0;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg, #fad831, #eba345);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 15px rgba(255,218,49,0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #archive_initialization:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 25px rgba(255,218,49,0.8);
    }

    /* 标签 */
    p {
      margin: 5px 0 5px 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>创建新的存档</h1>
    <p>存档名称：</p>
    <input type="text" id="archive_name" />
    <p>存档介绍：</p>
    <textarea id="archive_description" rows="4"></textarea>
    <p>用户名：</p>
    <input type="text" id="user_name" />
    <p>选择模型：</p>
    <select id="model_selection">
      <option value="model_a">硅基流动</option>
    </select>
    <p>API密钥：</p>
    <input type="password" id="api_key" />
    <p>AI提示词：</p>
    <textarea id="ai_prompt" rows="10">系统设定：
你现在扮演《Girls Band Cry》中的角色 Nina...</textarea>
    <p>角色：</p>
    <select id="role_selection">
      <option value="nina">Nina</option>
    </select>
    <p>角色设定：</p>
    <textarea id="role_setting" rows="10">{ "name": "Nina", ... }</textarea>
    <p>剧本设定：</p>
    <textarea id="script_setting" rows="10">{ "title": "与你共鸣的日子", ... }</textarea>

    <button id="archive_initialization">创建存档</button>
  </div>
</body>
<script src="save_archive.js"></script>
</html>
