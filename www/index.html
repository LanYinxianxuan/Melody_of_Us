<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『与你共鸣的日子』Melody_of_Us</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <style>
    body {
      background-image: url(assets/img/G36vr5qXQAAEvgn.jpg);
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        rgba(10, 10, 18, 0.45),
        rgba(25, 12, 40, 0.45)
      );
      pointer-events: none;
      z-index: -1;
    }
    .card {
      padding: 20px;
      max-width: 700px;
      background-color: rgba(97, 97, 97, 0.111);
      border: 1px solid rgb(165, 165, 165);
      border-radius: 20px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }
    h1,
    p {
      color: #ffffff;
      text-align: center;
    }
    button {
      margin: 20px auto;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(to right, #fad831, #eba345);
      box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.2);
    }
  </style>
  <body>
    <div class="card">
      <h1>『与你共鸣的日子』Melody_of_Us</h1>
      <p>
        欢迎游玩『与你共鸣的日子』Melody_of_Us，这是一款以《girls band
        cry》为if线的同人二创gaglame，与《girls band cry》的角色们聊天互动。
      </p>
      <button onclick="location.href='html/start_game.html'">开始游戏</button>
    </div>
  </body>
</html>
