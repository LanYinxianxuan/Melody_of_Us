<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『与你共鸣的日子』Melody_of_Us</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <style>
    body {
      background-image: url(../assets/img/G36vr5qXQAAEvgn.jpg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        rgba(10, 10, 18, 0.45),
        rgba(25, 12, 40, 0.45)
      );
      pointer-events: none;
      z-index: -1;
    }
    ul {
      padding: 0;
      margin: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      row-gap: 20px;
      height: 100vh;
    }
    li {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    button {
      max-width: 200px;
      width: 80vw;
      max-height: 100px;
      height: 8vh;
      font-size: 17px;
      background-color: rgba(103, 103, 103, 0.345);
      border: 1px solid rgb(165, 165, 165);
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
      border-radius: 999px;
    }
  </style>
  <body>
    <h1>『与你共鸣的日子』Melody_of_Us</h1>
    <ul>
      <li>
        <button onclick="location.href='create_new_archive.html'">
          开始新的存档
        </button>
