<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『与你共鸣的日子』Melody_of_Us</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <style>
    body {
      background-image: url(../assets/img/G36vr5qXQAAEvgn.jpg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        rgba(10, 10, 18, 0.45),
        rgba(25, 12, 40, 0.45)
      );
      pointer-events: none;
      z-index: -1;
    }
    ul {
      padding: 0;
      margin: 0;
      list-style: none;
    }
    li {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    button {
      max-width: 200px;
      width: 80vw;
      max-height: 100px;
      height: 8vh;
      font-size: 17px;
      background-color: rgba(240, 248, 255, 0);
      border: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), 0 8px 16px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
    }
    .card {
      padding: 20px;
      max-width: 700px;
      background-color: rgba(97, 97, 97, 0.111);
      border: 1px solid rgb(165, 165, 165);
      border-radius: 20px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
      text-align: center;
    }
  </style>
  <body>
    <div class="card">
      <h1>『与你共鸣的日子』</h1>
      <h1>Melody_of_Us</h1>
      <ul>
        <li>
          <button onclick="location.href='create_new_archive.html'">
            开始新的存档
          </button>
        </li>
        <li><button onclick="location.href='#'">选择存档</button></li>
        <li><button onclick="location.href='#'">设置</button></li>
        <li><button onclick="location.href='#'">关于</button></li>
      </ul>
    </div>
  </body>
</html>
