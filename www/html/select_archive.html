<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『与你共鸣的日子』 Melody_of_Us</title>
    <style>
      body {
        background-image: url(../assets/img/G36vr5qXQAAEvgn.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          to bottom right,
          rgba(10, 10, 18, 0.45),
          rgba(25, 12, 40, 0.45)
        );
        pointer-events: none;
        z-index: -1;
      }
      input {
        background-color: rgba(97, 97, 97, 0.111);
        border: 1px solid rgb(165, 165, 165);
        border-radius: 999px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        width: 100%;
        height: 25px;
        flex: 1;
      }
      .top {
        display: flex;
      }
      .search_bt {
        background-color: rgba(97, 97, 97, 0.111);
        border: 1px solid rgb(165, 165, 165);
        border-radius: 999px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: 2px;
      }
      .archive_list {
        display: flex;
        flex-direction: row;
        gap: 10px;
      }
      .archive_card {
        background-color: rgba(97, 97, 97, 0.111);
        border: 1px solid rgb(165, 165, 165);
        border-radius: 20px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        padding: 15px;
        margin: 7.5px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <input type="text" placeholder="搜索" />
      <button id="search_bt" class="search_bt">搜索</button>
    </div>
    <div class="archive_list" id="archive_list"
    </div>
  </body>
  <script src="../libs/select_archive.js"></script>
</html>
