<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天页面</title>
  </head>
  <style>
    body {
      background-image: url(../assets/img/G36vr5qXQAAEvgn.jpg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        rgba(10, 10, 18, 0.45),
        rgba(25, 12, 40, 0.45)
      );
      pointer-events: none;
      z-index: -1;
    }
  </style>
  <body>
    <textarea id="user_input"></textarea>
    <button id="user_input_send_button">发送</button>
    <button id="chat_history_button">聊天记录</button>
    <pre id="ai_dialogue"></pre>
    <pre id="ai_action"></pre>
    <pre id="ai_thoughts"></pre>
  </body>
  <script src="../libs/chat.js"></script>
</html>
